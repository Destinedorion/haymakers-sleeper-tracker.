name: Update Sleeper league snapshot
on:
  workflow_dispatch:
  schedule:
    # Every 3 hours, at minute 17 UTC. Scheduled runs can be delayed by GitHub.
    - cron: '17 */3 * * *'
permissions:
  contents: write
concurrency:
  group: sleeper-snapshot
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Sleeper data
        run: python scripts/fetch_sleeper.py
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Sleeper league snapshot"
            git push
          fi
